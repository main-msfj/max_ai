[project]
name = "maxai-worker"
version = "0.1.0"
description = "Runtime dependencies for the MaxAI Docker worker image."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "mcp>=1.26.0",
    "mcp-server-fetch>=2025.4.7",
    "openai>=2.24.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
