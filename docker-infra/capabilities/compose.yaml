# What the agents use: MongoDB (sessions, memory, knowledge, quotas) and
# object storage for their workspaces (MinIO, Azurite). Langfuse has its own
# MinIO in observability/, so agent files and traces never share a bucket.
services:
  mongodb:
    # Atlas local: MongoDB + Search (mongot), so $vectorSearch works locally.
    image: ${MONGODB_IMAGE:-mongodb/mongodb-atlas-local:8.2}
    restart: unless-stopped
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-maxai}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-maxai-local-dev}
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-atlas-data:/data/db
      - mongodb-atlas-config:/data/configdb
    networks:
      - capabilities
    # The image ships its own healthcheck.

  mongo-express:
    image: ${MONGO_EXPRESS_IMAGE:-mongo-express:1.0.2-20-alpine3.19}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGODB_USERNAME:-maxai}:${MONGODB_PASSWORD:-maxai-local-dev}@mongodb:27017/?authSource=admin&directConnection=true"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-maxai}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-maxai-local-ui}
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    networks:
      - capabilities

  minio:
    # The agents' workspaces (MinIOWorkspace). S3-compatible; MinIO no longer
    # publishes minio/minio on Docker Hub.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    restart: unless-stopped
    entrypoint: sh
    command: -c 'minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-maxai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-maxai-local-dev}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - capabilities
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    # Azure Blob emulator for AzureBlobWorkspace. Account devstoreaccount1 with
    # Azurite's well-known development key (see README); only for local use.
    image: ${AZURITE_IMAGE:-mcr.microsoft.com/azure-storage/azurite:latest}
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:${AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    networks:
      - capabilities
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongodb-atlas-data:
  mongodb-atlas-config:
  minio-data:
  azurite-data:

networks:
  capabilities:
