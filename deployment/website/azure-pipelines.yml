# Azure DevOps pipeline for the static HTML documentation site.
# Create AZURE_STATIC_WEB_APPS_API_TOKEN as a secret pipeline variable.
trigger:
  branches:
    include:
      - main

parameters:
  - name: appLocation
    displayName: Website files location
    type: string
    default: website
  - name: apiLocation
    displayName: Azure Functions location (leave empty for a static site)
    type: string
    default: ''
  - name: outputLocation
    displayName: Build output location (empty when deploying source files)
    type: string
    default: ''
  - name: deploymentEnvironment
    displayName: Static Web Apps environment (empty means production)
    type: string
    default: ''
  - name: apiTokenVariableName
    displayName: Name of the secret pipeline variable holding the deployment token
    type: string
    default: AZURE_STATIC_WEB_APPS_API_TOKEN

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: AzureStaticWebApp@0
    displayName: Deploy website to Azure Static Web Apps
    inputs:
      app_location: ${{ parameters.appLocation }}
      api_location: ${{ parameters.apiLocation }}
      output_location: ${{ parameters.outputLocation }}
      skip_app_build: true
      skip_api_build: true
      deployment_environment: ${{ parameters.deploymentEnvironment }}
      azure_static_web_apps_api_token: $(${{ parameters.apiTokenVariableName }})
