[project]
name = "maxai"
version = "0.1.0"
description = "A framework project for llm framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.2",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "mcp>=2.2,<3",
    "ollama>=0.6.1",
    "openai>=2.32.0",
    "opentelemetry-api>=1.41.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["max_ai"]

[tool.ruff.lint]
# Ruff's own defaults (E4, E7, E9, F) kept explicit, plus "I" (import
# sorting/formatting) — that's what actually surfaced this section.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (e.g. a running Ollama server)",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.8",
    "maxai[cli,embeddings,tracing,mongodb]",
]

[project.optional-dependencies]
# The terminal UI (max_ai.cli).
cli = [
    "textual>=8.2.8",
]
# Local embeddings for knowledge/memory search (downloads a small model once).
embeddings = [
    "fastembed>=0.7.4",
]
# Sending TracingMiddleware spans to Langfuse or any OTLP backend.
tracing = [
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
]
mongodb = [
    "pymongo>=4.13,<5",
]
runtime-modal = [
    "modal>=1.0,<2",
]
