[project]
name = "maxai"
version = "0.1.0"
description = "Framework for production LLM agents: stateless, serializable, with tools, MCP, memory, knowledge, skills, compaction, middleware and tracing."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Marvin Garcia", email = "marvin-garcia.developer@outlook.com" }]
keywords = ["llm", "agents", "ai", "mcp", "openai", "framework", "rag", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.27.2",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "mcp>=2.2,<3",
    "ollama>=0.6.1",
    "openai>=2.32.0",
    "opentelemetry-api>=1.41.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.12.0",
]

[project.urls]
Repository = "https://github.com/main-msfj/max_ai"
Issues = "https://github.com/main-msfj/max_ai/issues"
Changelog = "https://github.com/main-msfj/max_ai/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["max_ai"]

[tool.hatch.build.targets.sdist]
exclude = [
    "website", "docker-infra", "llm-models", "examples/local",
    "/*.png", ".devcontainer", "deployment",
]

[tool.ruff]
force-exclude = true
extend-exclude = ["website"]

[tool.ruff.lint]
# Ruff's own defaults (E4, E7, E9, F) kept explicit, plus "I" (import
# sorting/formatting) — that's what actually surfaced this section.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (e.g. a running Ollama server)",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.8",
    "maxai[cli,embeddings,tracing,mongodb,azure-blob,minio,runtime-modal]",
]

[project.optional-dependencies]
# The terminal UI (max_ai.cli).
cli = [
    "textual>=8.2.8",
]
# Local embeddings for knowledge/memory search (downloads a small model once).
embeddings = [
    "fastembed>=0.7.4",
]
# Sending TracingMiddleware spans to Langfuse or any OTLP backend.
tracing = [
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
]
mongodb = [
    "pymongo>=4.13,<5",
]
runtime-modal = [
    "modal>=1.0,<2",
]
# Remote workspaces (the user's files live in object storage).
azure-blob = [
    "azure-storage-blob[aio]>=12.20,<13",
]
minio = [
    "minio>=7.2,<8",
]
