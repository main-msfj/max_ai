[project]
name = "maxai"
version = "0.1.0"
description = "A framework project for llm framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "flask>=3.1.3",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "mcp>=2.0,<3",
    "ollama>=0.6.1",
    "openai>=2.24.0",
    "opentelemetry-distro>=0.60b1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.3",
    "qdrant-client[fastembed]>=1.17.0",
    "redis>=7.2.0",
    "requests>=2.32.5",
    "ruff>=0.16.8",
    "tiktoken>=0.12.0",
    "textual>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["max_ai"]

[tool.ruff.lint]
# Ruff's own defaults (E4, E7, E9, F) kept explicit, plus "I" (import
# sorting/formatting) — that's what actually surfaced this section.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (e.g. a running Ollama server)",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "mcp>=2.0,<3",
    "pyjwt>=2.11.0",
]

ui = [
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
mongodb = [
    "pymongo>=4.13,<5",
]
runtime-modal = [
    "modal>=1.0,<2",
]
artifacts-azure = [
    "azure-storage-blob>=12,<13",
    "azure-identity>=1,<2",
]
