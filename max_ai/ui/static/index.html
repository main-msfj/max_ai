<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark light" />
  <title>MaxAI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/static/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <script>
    // Configuración de Markdown segura y ligera
    (function setupMarked() {
      if (typeof marked === "undefined") {
        console.error("[markdown] marked failed to load");
        return;
      }
      const escHtml = (s) => String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

      marked.use({
        gfm: true,
        breaks: true,
        renderer: {
          code(code, infostring) {
            if (typeof code === "object" && code !== null) {
              infostring = code.lang; code = code.text;
            }
            const lang = (infostring || "").match(/\S*/)[0];
            const langAttr = lang ? ` data-lang="${lang}"` : ' data-lang="text"';
            return `<pre class="code-block"${langAttr}><code class="hljs">${escHtml(code)}</code></pre>`;
          },
          codespan(code) {
            if (typeof code === "object" && code !== null) code = code.text;
            return `<code class="inline-code">${escHtml(code)}</code>`;
          }
        }
      });
      window.__markedReady = true;
    })();
  </script>
</head>

<body>
  <div id="app" class="app">

    <!-- Icon rail -->
    <nav class="rail" aria-label="Primary navigation">
      <button id="newChatBtn" class="rail-btn btn-primary-action" type="button" aria-label="New chat" title="New chat">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
      <button id="workspaceToggle" class="rail-btn active" type="button" aria-label="Toggle artifacts"
        title="Artifacts">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        </svg>
      </button>
      <button id="eventsToggle" class="rail-btn" type="button" aria-label="Toggle events" title="Observability Traces">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
        </svg>
      </button>
      <div class="rail-spacer"></div>
      <button id="themeToggle" class="rail-btn" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
    </nav>

    <!-- Artifacts Panel -->
    <aside id="workspacePanel" class="workspace-panel" aria-label="Artifacts">
      <div class="panel-header">
        <h3>Artifacts</h3>
        <span style="font-size: 11px; color: var(--text-muted);" id="workspaceMeta">0 files</span>
      </div>
      <div id="workspaceSidebarFiles" class="workspace-sidebar-files" role="list"></div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main" role="main" aria-label="Chat">
      <header class="topbar">
        <div class="agent-picker">
          <span class="picker-label">Agent</span>
          <button type="button" class="agent-dd-trigger" id="agentPickerBtn">
            <span id="activeAgentLabel">Loading...</span>
          </button>
        </div>
        <div id="statusArea" class="status-indicator"></div>
      </header>

      <div id="planPanel" class="plan-panel" hidden></div>

      <section id="chatScroll" class="chat-scroll" aria-live="polite">
        <div id="emptyState" class="empty-state">
          <div class="empty-inner">
            <h2>MaxAI</h2>
            <p>Ready to assist. Send a message to start.</p>
          </div>
        </div>
        <div id="messagesContainer" style="display:none;"></div>
      </section>

      <footer class="input-area">
        <form id="chatForm" class="input-card" autocomplete="off">
          <textarea id="chatInput" placeholder="Message agent..." rows="1"></textarea>
          <div id="attachmentPreview" class="attachment-preview" aria-live="polite"></div>
          <div class="input-bottom">
            <input id="imageInput" type="file" accept="image/*" multiple hidden />
            <button type="button" id="attachImageBtn" class="icon-btn" aria-label="Attach image" title="Attach image">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <path d="M21 15l-5-5L5 21" />
              </svg>
            </button>
            <button type="button" id="contextWindowBtn" class="icon-btn context-window-btn" aria-label="Context window" title="Context window">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <path d="M7 9h10M7 13h6M7 17h8" />
              </svg>
            </button>
            <div id="contextWindowPopover" class="context-window-popover" hidden></div>
            <button type="button" id="sendBtn" class="send-btn" disabled aria-label="Send message">
              <svg viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </button>
          </div>
        </form>
      </footer>
    </main>

    <!-- Events / Traces Panel (Logfire Style) -->
    <aside id="eventsPanel" class="events-panel" aria-label="Logfire Traces">
      <div class="lf-header">
        <h3>Traces</h3>
        <div class="lf-actions">
          <button id="lfClear" class="lf-btn" title="Clear traces">Clear</button>
          <button id="eventsClose" class="lf-btn" title="Close panel">&times;</button>
        </div>
      </div>
      <div id="eventsScroll" class="lf-scroll"></div>
    </aside>

    <!-- Artifact Preview Modal -->
    <div id="workspaceModal" class="modal-overlay">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 style="font-size: 14px; font-weight: 600;" id="modalTitle">File Preview</h3>
          <button id="workspaceModalClose" class="modal-close">&times;</button>
        </div>
        <div id="workspaceModalBody" class="modal-body"></div>
      </div>
    </div>

  </div>
  <script src="/static/app.js" type="module"></script>
</body>

</html>
