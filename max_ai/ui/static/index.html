<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaxAI WebUI</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="nav-rail" aria-label="MaxAI">
        <div class="brand-lockup">
          <div class="brand-mark">M</div>
          <div>
            <div class="brand">MaxAI</div>
            <div class="subtitle">Agent WebUI</div>
          </div>
        </div>

        <section class="rail-section">
          <div class="rail-label">Agent</div>
          <div class="rail-card">
            <div class="rail-agent-name" id="agent-name">-</div>
            <div class="rail-agent-copy" id="agent-subtitle">Agent WebUI</div>
          </div>
        </section>

        <section class="rail-section">
          <div class="rail-label">Model</div>
          <div class="rail-card compact" id="agent-model">-</div>
        </section>

        <div class="rail-footer">
          <button class="ghost-button" id="clear-button" type="button">Clear session</button>
        </div>
      </aside>

      <main class="workspace">
        <section class="chat-panel" aria-label="Chat">
          <header class="chat-header">
            <div>
              <div class="chat-title">Chat</div>
              <div class="chat-subtitle">Single session test console</div>
            </div>
            <div class="status" id="status-pill">Idle</div>
          </header>

          <div class="messages" id="messages">
            <div class="empty-state">
              <div class="empty-title">Start a session</div>
              <div class="empty-copy">
                Send a message to test this agent, stream output, and approve tool calls.
              </div>
            </div>
          </div>

          <form class="composer" id="composer">
            <textarea
              id="message-input"
              rows="1"
              placeholder="Message the agent..."
              autocomplete="off"
            ></textarea>
            <button id="send-button" type="submit">Send</button>
          </form>
        </section>

        <aside class="side-panel" aria-label="Activity">
          <section class="panel-section approvals-section" id="approvals-section" hidden>
            <div class="section-row">
              <div class="section-title">Approvals</div>
              <div class="count-pill" id="approval-count">0</div>
            </div>
            <div id="approvals-list"></div>
            <button class="primary-wide" id="resume-button" type="button" disabled>
              Resume
            </button>
          </section>

          <section class="panel-section activity-section">
            <div class="section-row">
              <div class="section-title">Activity</div>
              <button class="link-button" id="clear-activity" type="button">Clear</button>
            </div>
            <div class="activity-list" id="activity-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
