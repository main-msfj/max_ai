<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Max AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>

  <!-- bootstrap marked BEFORE the module loads -->
  <script>
    (function setupMarked() {
      if (typeof marked === "undefined") {
        console.error("[markdown] marked failed to load");
        return;
      }

      const escHtml = (s) => String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

      // marked v12 renderer — uses POSITIONAL args (not object destructuring)
      marked.use({
        gfm: true,
        breaks: false,
        renderer: {
          code(code, infostring) {
            // Some marked versions pass an object instead. Normalize.
            if (typeof code === "object" && code !== null) {
              infostring = code.lang;
              code = code.text;
            }
            const lang = (infostring || "").match(/\S*/)[0];
            const validLang = lang && typeof hljs !== "undefined" && hljs.getLanguage(lang) ? lang : null;
            let highlighted;
            try {
              highlighted = validLang
                ? hljs.highlight(code, { language: validLang }).value
                : (typeof hljs !== "undefined" ? hljs.highlightAuto(code).value : escHtml(code));
            } catch (e) {
              highlighted = escHtml(code);
            }
            const langAttr = validLang ? ` data-lang="${validLang}"` : ' data-lang=""';
            const langClass = validLang ? ` language-${validLang}` : "";
            return `<pre class="code-block"${langAttr}><code class="hljs${langClass}">${highlighted}</code></pre>`;
          },
          codespan(code) {
            // Object form fallback
            if (typeof code === "object" && code !== null) code = code.text;
            return `<code class="inline-code">${code}</code>`;
          },
          table(header, body) {
            // marked v12 may pass either (header, body) strings OR a token object
            if (typeof header === "object" && header !== null && Array.isArray(header.header)) {
              const token = header;
              const headerCells = token.header.map((h) => `<th>${h.text || ""}</th>`).join("");
              const rows = token.rows
                .map((row) => `<tr>${row.map((cell) => `<td>${cell.text || ""}</td>`).join("")}</tr>`)
                .join("");
              return `<div class="table-wrap"><table class="md-table"><thead><tr>${headerCells}</tr></thead><tbody>${rows}</tbody></table></div>`;
            }
            return `<div class="table-wrap"><table class="md-table"><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
          },
        },
      });
      window.__markedReady = true;
      console.log("[markdown] marked v12 ready");
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <aside id="workspacePanel" class="workspace-panel open">
      <div class="workspace-panel-top">
        <button id="newChatBtn" class="new-chat-btn workspace-new-chat" type="button">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New chat
        </button>
      </div>
      <div class="workspace-panel-header">
        <div>
          <h3>Workspace</h3>
          <div id="workspacePanelMeta" class="workspace-panel-meta">0 files</div>
        </div>
        <div class="workspace-panel-actions">
          <button id="workspaceRefreshBtn" class="workspace-refresh-btn" type="button">Refresh</button>
          <button id="workspaceClose" class="workspace-close" type="button">&times;</button>
        </div>
      </div>
      <div id="workspaceSidebarFiles" class="workspace-sidebar-files">
        <div class="workspace-file-empty">No files yet</div>
      </div>
    </aside>

    <div class="main main-full">
      <div id="errorBar" class="error-bar" style="display:none"></div>

      <header class="topbar">
        <div class="topbar-left">
          <label class="agent-picker">
            <span class="picker-label">Agent</span>
            <div class="agent-dd" id="agentDropdown"></div>
          </label>
        </div>
        <div class="topbar-right">
          <button id="workspaceToggle" class="events-toggle topbar-btn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
            Workspace
          </button>
          <button id="themeToggle" class="events-toggle topbar-btn"></button>
          <button id="eventsToggle" class="events-toggle event-switch topbar-btn" type="button" aria-pressed="false">
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span>Events</span>
            <span id="eventsBadge" class="badge" style="display:none">0</span>
          </button>
        </div>
      </header>

      <div id="chatScroll" class="chat-scroll">
        <div id="emptyState" class="empty-state">
          <div class="empty-inner">
            <h2>Max AI</h2>
            <p>Send a message to get started.<br>Use <code>@skill-name</code> only when you want to call a specific skill.</p>
          </div>
        </div>
        <div id="messagesContainer" style="display:none"></div>
      </div>

      <div class="input-area">
        <form id="chatForm" class="input-card">
          <div class="input-wrap">
            <textarea id="chatInput" placeholder="Message…" rows="1"></textarea>
            <div id="skillDropdown" class="skill-dropdown" style="display:none"></div>
          </div>
          <div class="input-bottom">
            <div class="input-bottom-left">
              <button type="button" id="contextToggle" class="context-toggle" title="Context & tools">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
              </button>
              <button type="button" id="imageUploadBtn" class="context-toggle" title="Upload image">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              </button>
              <input id="imageInput" type="file" accept="image/*" multiple hidden />
              <div id="attachmentTray" class="attachment-tray" style="display:none"></div>
              <div id="toolRunStatus" class="tool-run-status" style="display:none"></div>
              <div id="contextPopover" class="context-popover" style="display:none">
                <div class="context-popover-section">
                  <div class="context-popover-row">
                    <span class="context-popover-label">Context</span>
                    <span id="tokenMeta" class="context-popover-value">0 / -</span>
                  </div>
                  <div class="token-meter-track">
                    <div id="tokenFill" class="token-meter-fill"></div>
                  </div>
                </div>
                <div class="context-popover-section">
                  <span class="context-popover-label">Tools</span>
                  <div id="popoverTools" class="popover-tools"></div>
                </div>
              </div>
            </div>
            <button type="submit" id="sendBtn" class="send-btn" disabled>
              <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="workspaceModal" class="workspace-modal" style="display:none">
      <div class="workspace-modal-dialog">
        <div class="workspace-modal-header">
          <div class="workspace-modal-title">File Preview</div>
          <button id="workspaceModalClose" class="workspace-modal-close" type="button">&times;</button>
        </div>
        <div id="workspaceModalBody" class="workspace-modal-body">
          <div class="workspace-preview-empty">Select a file to preview it here.</div>
        </div>
      </div>
    </div>

    <aside id="eventsPanel" class="events-panel">
      <div class="events-panel-header">
        <h3>Events</h3>
        <button id="eventsClose" class="events-close">&times;</button>
      </div>
      <div id="eventsScroll" class="events-scroll">
        <div class="events-empty">No events yet.</div>
      </div>
    </aside>
  </div>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
