provider: maxai.agents.Agent
config:
  name: TravelPlanner
  description: Researches trips on the web and delivers the plan as an Excel workbook.
  instructions: You help users plan trips.
  client:
    provider: max_ai.capabilities.clients.openrouter.OpenRouterChatCompletionClient
    config:
      model: deepseek/deepseek-v4-flash
      fallback_models:
      - z-ai/glm-5.3-flash
      - qwen/qwen3.7-flash
      app_name: full_test
      config:
        max_output_tokens: 12800
      retry:
        attempts: 3
  reasoning:
    provider: max_ai.capabilities.loop.react.ReactLoop
    config:
      compaction:
        provider: max_ai.capabilities.compaction.summary.SummaryCompaction
  sandbox:
    provider: max_ai.capabilities.sandbox.local.LocalSandbox
    config:
      root: /max_ai/example-for-deployment/full_test_box
  memory:
    read_only: false
  skills:
    provider: max_ai.capabilities.skills.github.GitHubSkills
    config:
      url: https://github.com/trailofbits/skills-curated/tree/main/plugins/openai-spreadsheet/skills
      skills:
      - openai-spreadsheet
  toolset:
  - provider: max_ai.capabilities.tools.bash._toolset.BashTool
  mcp:
  - server_id: exa
    approval_mode: auto_approval
    url: https://mcp.exa.ai/mcp
    headers_env:
      x-api-key: EXA_API_KEY
  middlewares:
  - provider: max_ai.capabilities.middleware.TracingMiddleware
