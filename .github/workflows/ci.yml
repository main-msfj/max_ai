name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check max_ai tests examples

      # The multilingual embedding model (~220MB) used by a few tests.
      - uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2

      - name: Test
        run: uv run pytest -q
